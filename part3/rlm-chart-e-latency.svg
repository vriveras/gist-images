<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold">
    (e) Latency Distribution: Before vs After (n=1,000 queries)
  </text>
  
  <!-- Y-axis label -->
  <text x="30" y="250" text-anchor="middle" font-family="serif" font-size="12" transform="rotate(-90 30 250)">
    Query Latency (ms, log scale)
  </text>
  
  <!-- Y-axis -->
  <line x1="80" y1="60" x2="80" y2="440" stroke="#333" stroke-width="1"/>
  
  <!-- Y-axis labels (log scale markers) -->
  <text x="70" y="440" text-anchor="end" font-family="serif" font-size="10">1</text>
  <text x="70" y="380" text-anchor="end" font-family="serif" font-size="10">10</text>
  <text x="70" y="320" text-anchor="end" font-family="serif" font-size="10">100</text>
  <text x="70" y="260" text-anchor="end" font-family="serif" font-size="10">1,000</text>
  <text x="70" y="200" text-anchor="end" font-family="serif" font-size="10">3,000</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="380" x2="720" y2="380" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="320" x2="720" y2="320" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="260" x2="720" y2="260" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="200" x2="720" y2="200" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- Baseline (Linear Scan) -->
  <rect x="150" y="200" width="60" height="15" fill="#c0392b" opacity="0.8"/>
  <line x1="180" y1="195" x2="180" y2="170" stroke="#c0392b" stroke-width="2"/>
  <line x1="170" y1="170" x2="190" y2="170" stroke="#c0392b" stroke-width="2"/>  <!-- P99 cap -->
  <text x="180" y="165" text-anchor="middle" font-family="serif" font-size="9" fill="#c0392b">P99: ~3,500</text>
  <text x="180" y="230" text-anchor="middle" font-family="serif" font-size="11" font-weight="bold" fill="#c0392b">565</text>
  <text x="180" y="470" text-anchor="middle" font-family="serif" font-size="10">Baseline</text>
  <text x="180" y="485" text-anchor="middle" font-family="serif" font-size="9" fill="#666">(Linear Scan)</text>
  
  <!-- Phase 2 (Inverted Index) -->
  <rect x="350" y="390" width="60" height="10" fill="#e67e22" opacity="0.8"/>
  <line x1="380" y1="385" x2="380" y2="360" stroke="#e67e22" stroke-width="2"/>
  <line x1="370" y1="360" x2="390" y2="360" stroke="#e67e22" stroke-width="2"/>
  <text x="380" y="355" text-anchor="middle" font-family="serif" font-size="9" fill="#e67e22">P95: 8.1</text>
  <text x="380" y="415" text-anchor="middle" font-family="serif" font-size="11" font-weight="bold" fill="#e67e22">2.4</text>
  <text x="380" y="495" text-anchor="middle" font-family="serif" font-size="10">Phase 2</text>
  <text x="380" y="470" text-anchor="middle" font-family="serif" font-size="9" fill="#27ae60" font-weight="bold">235x ↓</text>
  
  <!-- Phase 3 (Deterministic) -->
  <rect x="550" y="380" width="60" height="8" fill="#27ae60" opacity="0.8"/>
  <line x1="580" y1="375" x2="580" y2="355" stroke="#27ae60" stroke-width="2"/>
  <line x1="570" y1="355" x2="590" y2="355" stroke="#27ae60" stroke-width="2"/>
  <text x="580" y="350" text-anchor="middle" font-family="serif" font-size="9" fill="#27ae60">P95: ~45</text>
  <text x="580" y="405" text-anchor="middle" font-family="serif" font-size="11" font-weight="bold" fill="#27ae60">15</text>
  <text x="580" y="470" text-anchor="middle" font-family="serif" font-size="9" fill="#27ae60" font-weight="bold">+67% tokens ↓</text>
  <text x="580" y="495" text-anchor="middle" font-family="serif" font-size="10">Phase 3</text>
  
  <!-- X-axis -->
  <line x1="80" y1="440" x2="720" y2="440" stroke="#333" stroke-width="1"/>
  
  <!-- Legend -->
  <rect x="520" y="80" width="180" height="80" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="530" y="95" width="15" height="8" fill="#c0392b"/>
  <text x="555" y="102" font-family="serif" font-size="9">Median + P99 range</text>
  <line x1="530" y1="120" x2="545" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="537" y1="115" x2="537" y2="125" stroke="#333" stroke-width="2"/>
  <text x="555" y="125" font-family="serif" font-size="9">Error bar (P99)</text>
  
  <!-- Footer -->
  <text x="400" y="525" text-anchor="middle" font-family="serif" font-size="9" fill="#666" font-style="italic">
    Log scale used to visualize wide distribution. Phase 3 includes synchronous search overhead.
  </text>
</svg>