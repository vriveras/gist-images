<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .box { fill:#0b1220; stroke:#94a3b8; stroke-width:2; rx:12; }
      .title { fill:#e5e7eb; font:600 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .text { fill:#e5e7eb; font:400 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .sub { fill:#cbd5e1; font:400 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .label { fill:#93c5fd; font:600 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .arrow { stroke:#60a5fa; stroke-width:2.5; fill:none; marker-end:url(#arrowHead); }
      .arrow2 { stroke:#a78bfa; stroke-width:2.5; fill:none; marker-end:url(#arrowHead2); }
      .arrow3 { stroke:#34d399; stroke-width:2.5; fill:none; marker-end:url(#arrowHead3); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#60a5fa" />
    </marker>
    <marker id="arrowHead2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a78bfa" />
    </marker>
    <marker id="arrowHead3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#34d399" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="46" class="title">RLM Retrieval: Skill ↔ OpenClaw Architecture</text>
  <text x="40" y="72" class="sub">Deterministic retrieval comes from wiring the pipeline into infrastructure (tools + hooks), not prompts.</text>

  <!-- User / Agent -->
  <rect x="60" y="120" width="220" height="90" class="box" />
  <text x="80" y="155" class="title">User</text>
  <text x="80" y="182" class="text">Asks a history/status question</text>

  <rect x="60" y="250" width="220" height="110" class="box" />
  <text x="80" y="285" class="title">Agent</text>
  <text x="80" y="312" class="text">Calls memory_search / memory_get</text>

  <!-- OpenClaw tools -->
  <rect x="360" y="140" width="320" height="110" class="box" />
  <text x="380" y="175" class="title">OpenClaw Tools</text>
  <text x="380" y="205" class="text">memory_search (semantic)</text>
  <text x="380" y="228" class="text">memory_get (fetch exact lines)</text>

  <!-- Semantic index -->
  <rect x="740" y="140" width="390" height="110" class="box" />
  <text x="760" y="175" class="title">Memory Index</text>
  <text x="760" y="205" class="text">Embeddings + BM25 hybrid ranking</text>
  <text x="760" y="228" class="sub">(built-in semantic retrieval)</text>

  <!-- Hook bus -->
  <rect x="360" y="300" width="320" height="130" class="box" />
  <text x="380" y="335" class="title">Hook Bus</text>
  <text x="380" y="365" class="text">tool:memory_search:post</text>
  <text x="380" y="388" class="text">session:transcript:update</text>
  <text x="380" y="412" class="sub">Manifest-based hooks run outside model intent</text>

  <!-- Transcripts -->
  <rect x="740" y="320" width="390" height="110" class="box" />
  <text x="760" y="355" class="title">Session Transcripts</text>
  <text x="760" y="385" class="text">sessions/*.jsonl</text>
  <text x="760" y="408" class="sub">Raw environment data (source of truth)</text>

  <!-- RLM skill -->
  <rect x="360" y="490" width="770" height="210" class="box" />
  <text x="380" y="525" class="title">RLM Retrieval Skill (rlm-retrieval)</text>

  <rect x="400" y="555" width="330" height="120" class="box" />
  <text x="420" y="585" class="title">temporal_search.py</text>
  <text x="420" y="612" class="text">Keyword/RLM matching</text>
  <text x="420" y="635" class="text">Temporal filtering ("yesterday", "last week")</text>

  <rect x="760" y="555" width="330" height="120" class="box" />
  <text x="780" y="585" class="title">index-sessions.py</text>
  <text x="780" y="612" class="text">Build sessions-index.json</text>
  <text x="780" y="635" class="text">Extract topics for fast narrowing</text>

  <text x="380" y="690" class="sub">Outputs: sessions-index.json + context-state.json</text>

  <!-- Arrows -->
  <path d="M280 165 L360 185" class="arrow" />
  <text x="295" y="170" class="label">message</text>

  <path d="M280 305 L360 195" class="arrow" />
  <text x="300" y="250" class="label">calls tools</text>

  <path d="M680 195 L740 195" class="arrow" />
  <text x="690" y="185" class="label">semantic results (🔮)</text>

  <path d="M520 250 L520 300" class="arrow2" />
  <text x="540" y="285" class="label">emit tool event</text>

  <path d="M740 375 L680 365" class="arrow" />
  <text x="690" y="350" class="label">transcripts change</text>

  <path d="M520 430 L520 490" class="arrow2" />
  <text x="540" y="470" class="label">invoke hooks</text>

  <path d="M680 365 L740 375" class="arrow3" />
  <text x="690" y="410" class="label">writes JSONL</text>

  <path d="M520 430 L565 555" class="arrow2" />
  <text x="560" y="505" class="label">rlm-augment</text>

  <path d="M520 430 L925 555" class="arrow2" />
  <text x="820" y="505" class="label">rlm-index-refresh</text>

</svg>
